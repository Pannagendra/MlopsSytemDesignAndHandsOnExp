backendStore:
  database:
    type: mysql
    host: mlflow-db
    port: 3306
    user: mlflow
    password: mlflowpass

defaultArtifactRoot: s3://mlflow-artifacts/

service:
  type: ClusterIP
  port: 5000

s3:
  enabled: true
  bucket: mlflow-artifacts
  accessKey: YOUR_ACCESS_KEY
  secretKey: YOUR_SECRET_KEY
  region: us-east-1
