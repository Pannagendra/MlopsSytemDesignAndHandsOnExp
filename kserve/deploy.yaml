apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: my-model
  namespace: default
spec:
  predictor:
    containers:
    - image: pannagendra/mlops-model:latest
      name: kserve-container
      command: ["python"]
      args: ["app/main.py"]
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
